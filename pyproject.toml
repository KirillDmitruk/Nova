[project]
name = "nova"
version = "0.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "google-genai>=2.12.0",
    "httpx>=0.28.1",
    "openai>=3.33.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]
pythonpath = ["."]
